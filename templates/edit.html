{% extends "base.html" %}

{% block content %}
<h1>Edit Expense</h1>

<form method="POST" class="expense-form">

    <label>Category</label><br>
    <input
        type="text"
        name="category"
        value="{{ expense.category }}"
        required
    >
    <br><br>

    <label>Item</label><br>
    <input
        type="text"
        name="item"
        value="{{ expense.item }}"
        required
    >
    <br><br>

    <label>Price</label><br>
    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ expense.price }}"
        required
    >
    <br><br>

    <label>Date</label><br>
    <input
        type="date"
        name="date"
        value="{{ expense.date }}"
        required
    >
    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>


{% endblock %}
